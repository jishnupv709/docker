<div class="container">
  <h1>🐳 Full-Stack Docker App</h1>
  <p class="subtitle">NestJS + Angular + MongoDB on Render</p>

  <!-- Add Item Form -->
  <div class="card form-group">
    <input [(ngModel)]="newItemName" placeholder="Item Name" (keyup.enter)="addItem()">
    <input [(ngModel)]="newItemDesc" placeholder="Description (optional)" (keyup.enter)="addItem()">
    <button (click)="addItem()">Add Item</button>
  </div>

  <!-- Items List -->
  <div class="card">
    <h2>Items List</h2>
    @if (items.length === 0) {
      <p class="empty">No items yet. Add one above!</p>
    } @else {
      <ul>
        @for (item of items; track item._id) {
          <li>
            <div>
              <strong>{{ item.name }}</strong>
              @if (item.description) { <span>- {{ item.description }}</span> }
            </div>
            <button class="delete-btn" (click)="deleteItem(item._id)">Delete</button>
          </li>
        }
      </ul>
    }
  </div>
</div>
